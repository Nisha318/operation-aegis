# ============================================================
# Operation Aegis - sast-sca.yml (CodeQL portion)
# Triggers: pull_request to main, push to main
#
# Jobs:
#   1. analyze - CodeQL static analysis (python, actions) with a
#                security-severity >= 7.0 gate that hard-fails the
#                build on any high-or-critical finding
#
# Trivy (SCA) is a separate job in this same file, added once its
# own six-step discovery process is complete.
# ============================================================

name: "Operation Aegis - SAST/SCA"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:actions"

    # KNOWN LIMITATION (logged in decision log): this job uses
    # codeql-action's diff-informed analysis, which only reports alerts
    # in changed lines on this run. Accepted for now since the actual
    # known vulnerabilities live in app/main.py, covered by the
    # full-scan python job below, not in workflow YAML.
    - name: SAST Gate - CodeQL severity check (actions, diff-scoped)
      run: |
        jq -e '[.runs[0].tool.driver.rules as $rules | .runs[0].results[] | .ruleId as $rid | $rules[] | select(.id == $rid) | .properties."security-severity" | tonumber >= 7] | any | not' "${{ steps.analyze.outputs.sarif-output }}/actions.sarif"

  analyze-python:
    name: Analyze (python, full scan via CodeQL CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install CodeQL CLI
      run: gh extension install github/gh-codeql
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create CodeQL database (full scan, no overlay/incremental)
      run: gh codeql database create -l python codeql-db
      env:
        GH_TOKEN: ${{ github.token }}


    - name: Run CodeQL analysis
      run: gh codeql database analyze --format=sarifv2.1.0 --download -o results.sarif -- codeql-db codeql/python-queries
      env:
        GH_TOKEN: ${{ github.token }}
      
    - name: Upload CodeQL artifact
      uses: actions/upload-artifact@v7
      with:
        name: codeql-python-results
        path: results.sarif

    - name: SAST Gate - CodeQL severity check (python, full scan)
      run: |
        jq -e '[.runs[0].tool.driver.rules as $rules | .runs[0].results[] | .ruleId as $rid | $rules[] | select(.id == $rid) | .properties."security-severity" | tonumber >= 7] | any | not' results.sarif
