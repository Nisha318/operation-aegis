# ============================================================
# Operation Aegis - sast-sca.yml (CodeQL portion)
# Triggers: pull_request to main, push to main
#
# Jobs:
#   1. analyze - CodeQL static analysis (python, actions) with a
#                security-severity >= 7.0 gate that hard-fails the
#                build on any high-or-critical finding
#
# Trivy (SCA) is a separate job in this same file, added once its
# own six-step discovery process is complete.
# ============================================================

name: "Operation Aegis - SAST/SCA"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'Replace this with real build commands if a language needs manual mode.'
        exit 1

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

    - name: SAST Gate - CodeQL severity check
      run: |
        jq -e '[.runs[0].tool.driver.rules as $rules | .runs[0].results[] | .ruleId as $rid | $rules[] | select(.id == $rid) | .properties."security-severity" | tonumber >= 7] | any | not' "${{ steps.analyze.outputs.sarif-output }}/${{ matrix.language }}.sarif"
